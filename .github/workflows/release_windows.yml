name: ReleaseWindows
on:
  push:
    tags:
      - 'windows*'
jobs:
  package-windows:
    name: Package Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: |
            ./*.gradle*
            ./**/gradle-wrapper.properties

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
          export-path-to-vs: VS_PATH

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: pwsh
        run: |
          if ($IsWindows) {
            $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          }
          else {
            $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager'
          }
          & $sdkManager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'

      - name: Write local.properties
        shell: pwsh
        run: |
          $escaped = $env:ANDROID_HOME.Replace('\', '\\')
          "sdk.dir=$escaped" | Set-Content -Path local.properties -Encoding ascii

      - name: Build
        run: ./gradlew ylcs-app:desktopApp:desktopPublish